<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" role="img" aria-labelledby="sim-title sim-desc">
  <title id="sim-title">Southbound simulator subsystem</title>
  <desc id="sim-desc">Exploded view of the simulator: entry points, runtime and deterministic agent loop, AccessHub and SimAdapter, six virtual devices, state update path, and the contract test trace.</desc>
  <defs>
    <pattern id="sim-grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#12262F" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <marker id="sim-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#12262F"/>
    </marker>
    <marker id="sim-arrow-signal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#CF4A29"/>
    </marker>
    <marker id="sim-arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0F7D78"/>
    </marker>
  </defs>

  <style>
    .mono { font-family: "SF Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif; }
    .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Songti SC", serif; }
    .kicker { font-family: "SF Mono", Menlo, monospace; font-size: 10.5px; fill: #70848B; letter-spacing: 0.08em; }
    .title { font-family: "Iowan Old Style", Palatino, "Songti SC", serif; font-size: 38px; font-weight: 600; fill: #12262F; letter-spacing: -0.02em; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; font-size: 13px; fill: #435A63; }
    .section { font-family: "SF Mono", Menlo, monospace; font-size: 10px; fill: #0F7D78; letter-spacing: 0.07em; }
    .section-light { font-family: "SF Mono", Menlo, monospace; font-size: 10px; fill: #9BD6CD; letter-spacing: 0.07em; }
    .heading { font-family: "Iowan Old Style", Palatino, "Songti SC", serif; font-size: 22px; font-weight: 600; fill: #12262F; }
    .heading-light { font-family: "Iowan Old Style", Palatino, "Songti SC", serif; font-size: 19px; font-weight: 600; fill: #E8EDEE; }
    .body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; font-size: 10px; fill: #435A63; }
    .body-light { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; font-size: 10px; fill: #C4D4D3; }
    .mono-small { font-family: "SF Mono", Menlo, monospace; font-size: 9px; fill: #70848B; }
    .mono-light { font-family: "SF Mono", Menlo, monospace; font-size: 9px; fill: #C4D4D3; }
    .tiny { font-family: "SF Mono", Menlo, monospace; font-size: 7.5px; fill: #70848B; }
    .paper-card { fill: #F4F6F5; stroke: #12262F; stroke-width: 1.1; }
    .soft-card { fill: #EDF3F2; stroke: #B7C5C9; stroke-width: 0.8; }
    .dark-card { fill: #12262F; stroke: #12262F; stroke-width: 1; }
    .inner-dark { fill: #17343F; stroke: #557078; stroke-width: 0.8; }
    .dash { stroke-dasharray: 4 3; }
  </style>

  <rect width="1600" height="1120" fill="#E8EDEE"/>
  <rect width="1600" height="1120" fill="url(#sim-grid)"/>
  <rect x="20" y="20" width="1560" height="1080" fill="none" stroke="#12262F" stroke-width="2"/>
  <rect x="20" y="20" width="1560" height="8" fill="#CF4A29"/>

  <text x="50" y="58" class="kicker">SOUTHBOUND / SUBSYSTEM 01 · SIMULATOR · v0.10.0</text>
  <text x="50" y="101" class="title">Simulator / Exploded View</text>
  <text x="50" y="128" class="subtitle">虚拟设备、确定性 agent loop 与同一套 AccessHub 合约。没有 radio、没有物理设备、没有云端。</text>
  <text x="1550" y="58" text-anchor="end" class="mono-small">CONTRACT TEST RIG</text>
  <text x="1550" y="74" text-anchor="end" class="tiny">same policy · same audit · same capabilities</text>

  <!-- column labels -->
  <text x="50" y="174" class="section">01 / ENTRY POINTS</text>
  <text x="410" y="174" class="section">02 / RUNTIME + DETERMINISTIC AGENT</text>
  <text x="950" y="174" class="section">03 / SIMULATOR STATE</text>

  <!-- entry column -->
  <rect x="50" y="190" width="330" height="550" class="paper-card"/>
  <text x="70" y="216" class="mono-small">CLI</text>
  <rect x="70" y="226" width="290" height="58" class="soft-card"/>
  <text x="84" y="245" class="mono-small">southbound sim / intent</text>
  <text x="84" y="260" class="body">goal → trace → result</text>
  <text x="84" y="274" class="tiny">python3 -m southbound intent ...</text>

  <text x="70" y="308" class="mono-small">HTTP</text>
  <rect x="70" y="318" width="290" height="58" class="soft-card"/>
  <text x="84" y="337" class="mono-small">/api/sim/devices</text>
  <text x="84" y="352" class="body">/api/northbound/intent · /call</text>
  <text x="84" y="366" class="tiny">/api/scene/presence · /api/events</text>

  <text x="70" y="400" class="mono-small">MCP</text>
  <rect x="70" y="410" width="290" height="58" class="soft-card"/>
  <text x="84" y="429" class="mono-small">sim_devices · sim_action · sim_goal</text>
  <text x="84" y="444" class="body">iot_call · iot_commission</text>
  <text x="84" y="458" class="tiny">stdio server; same tool catalog</text>

  <text x="70" y="492" class="mono-small">VISUAL / SCENE</text>
  <rect x="70" y="502" width="290" height="58" class="soft-card"/>
  <text x="84" y="521" class="mono-small">dashboard + /scene</text>
  <text x="84" y="536" class="body">Agent console · 2.5D presence</text>
  <text x="84" y="550" class="tiny">SPLAT preview · SSE flowbar</text>

  <text x="70" y="592" class="mono-small">ENTRY CONTRACT</text>
  <text x="70" y="609" class="body">All paths converge on the same</text>
  <text x="70" y="624" class="body">SouthboundRuntime and AccessHub.</text>
  <text x="70" y="639" class="body">CLI is process-local; HTTP/MCP share</text>
  <text x="70" y="654" class="body">the long-running runtime when served.</text>
  <rect x="70" y="674" width="290" height="44" class="soft-card"/>
  <text x="84" y="690" class="mono-small">NO HARDWARE REQUIRED</text>
  <text x="84" y="705" class="body">run demo and tests on any Python 3.10+ host</text>

  <!-- center column -->
  <rect x="410" y="190" width="520" height="550" class="paper-card"/>
  <rect x="430" y="212" width="480" height="116" class="dark-card"/>
  <text x="448" y="235" class="section-light">SOUTHBOUND RUNTIME</text>
  <text x="448" y="257" class="heading-light">Device graph + lifecycle</text>
  <text x="448" y="276" class="body-light">owns simulator, AccessHub, store, event bus</text>
  <text x="448" y="291" class="body-light">restores commissioned sim devices on startup</text>
  <text x="448" y="306" class="body-light">close() releases subscriptions and adapters</text>

  <rect x="430" y="344" width="480" height="100" class="soft-card"/>
  <text x="448" y="367" class="section">SIM_AGENT.RUN_GOAL</text>
  <text x="448" y="388" class="heading">Deterministic planner</text>
  <text x="448" y="406" class="body">split clauses → type/room hints → sim.find</text>
  <text x="448" y="421" class="body">choose action → sim.act → sim.get → trace</text>
  <text x="448" y="436" class="tiny">no LLM required; each step is returned to the UI</text>

  <rect x="430" y="458" width="235" height="84" class="soft-card"/>
  <text x="448" y="480" class="section">ACCESS HUB</text>
  <text x="448" y="499" class="body">schema validate</text>
  <text x="448" y="514" class="body">policy + risk</text>
  <text x="448" y="529" class="body">audit · readback</text>
  <rect x="675" y="458" width="235" height="84" class="soft-card"/>
  <text x="693" y="480" class="section">EVENT BUS / SSE</text>
  <text x="693" y="499" class="body">command / state</text>
  <text x="693" y="514" class="body">intent / result</text>
  <text x="693" y="529" class="body">device events</text>

  <rect x="430" y="562" width="480" height="66" class="soft-card"/>
  <text x="448" y="585" class="section">SIM ADAPTER</text>
  <text x="448" y="604" class="body">DeviceAdapter contract: bindings · call · add_device · remove_device</text>
  <text x="448" y="619" class="tiny">translates capability</text>

  <rect x="430" y="648" width="480" height="68" class="soft-card dash"/>
  <text x="448" y="671" class="section">SCENE CONTROLLER (DEMO CONSUMER)</text>
  <text x="448" y="690" class="body">presence → low-risk reflex → runtime.call → verify</text>
  <text x="448" y="705" class="tiny">2.5D / synthetic splat read the same simulator state</text>

  <line x1="380" y1="450" x2="408" y2="450" stroke="#12262F" stroke-width="1.1" marker-end="url(#sim-arrow)"/>
  <line x1="930" y1="450" x2="948" y2="450" stroke="#12262F" stroke-width="1.1" marker-end="url(#sim-arrow)"/>
  <line x1="817" y1="328" x2="817" y2="342" stroke="#CF4A29" stroke-width="1.1" marker-end="url(#sim-arrow-signal)"/>
  <line x1="817" y1="444" x2="817" y2="456" stroke="#CF4A29" stroke-width="1.1" marker-end="url(#sim-arrow-signal)"/>
  <line x1="817" y1="542" x2="817" y2="560" stroke="#CF4A29" stroke-width="1.1" marker-end="url(#sim-arrow-signal)"/>

  <!-- simulator column -->
  <rect x="950" y="190" width="600" height="550" class="paper-card"/>
  <rect x="970" y="212" width="560" height="52" class="dark-card"/>
  <text x="988" y="234" class="section-light">SIMULATOR</text>
  <text x="988" y="251" class="body-light">in-memory state · RLock · last_changed · lazy _tick()</text>
  <text x="1490" y="251" text-anchor="end" class="tiny" fill="#9BD6CD">no radio</text>

  <!-- device cards 2 x 3 -->
  <rect x="970" y="280" width="270" height="62" class="soft-card"/>
  <text x="984" y="300" class="mono-small">客厅主灯 · T1</text>
  <text x="984" y="316" class="body">light · Matter</text>
  <text x="984" y="331" class="tiny">on=false · brightness=60 · power=0W</text>
  <rect x="1248" y="280" width="282" height="62" class="soft-card"/>
  <text x="1262" y="300" class="mono-small">书房插座 · T1</text>
  <text x="1262" y="316" class="body">plug · MQTT</text>
  <text x="1262" y="331" class="tiny">on=true · power_w≈42.5</text>

  <rect x="970" y="350" width="270" height="62" class="soft-card"/>
  <text x="984" y="370" class="mono-small">温湿度计 · T1</text>
  <text x="984" y="386" class="body">sensor · Zigbee</text>
  <text x="984" y="401" class="tiny">temp≈23.4°C · humidity≈48%</text>
  <rect x="1248" y="350" width="282" height="62" class="soft-card"/>
  <text x="1262" y="370" class="mono-small">客厅窗帘 · T1</text>
  <text x="1262" y="386" class="body">cover · MQTT</text>
  <text x="1262" y="401" class="tiny">position=0 · moving=false</text>

  <rect x="970" y="420" width="270" height="62" class="soft-card"/>
  <text x="984" y="440" class="mono-small">入户门磁 · T0</text>
  <text x="984" y="456" class="body">binary_sensor · Zigbee</text>
  <text x="984" y="471" class="tiny">open=false · battery=88%</text>
  <rect x="1248" y="420" width="282" height="62" class="soft-card"/>
  <text x="1262" y="440" class="mono-small">卧室净化器 · T1</text>
  <text x="1262" y="456" class="body">purifier · Matter</text>
  <text x="1262" y="471" class="tiny">on=false · pm25=18 · mode=auto</text>

  <rect x="970" y="496" width="560" height="76" class="soft-card"/>
  <text x="984" y="518" class="section">STATE API</text>
  <text x="984" y="536" class="body">snapshot() · get_device() · list_devices() · summary()</text>
  <text x="984" y="551" class="body">action(device_id, action, value) · reset()</text>
  <text x="984" y="565" class="tiny">add_device(spec) · remove_device() for commissioning demos</text>

  <rect x="970" y="584" width="560" height="62" class="soft-card dash"/>
  <text x="984" y="605" class="section">DYNAMIC DEVICES</text>
  <text x="984" y="623" class="body">commission a sim device → add_device → default state by kind</text>
  <text x="984" y="638" class="tiny">CommissionStore restores authorized virtual devices on startup</text>

  <rect x="970" y="658" width="560" height="58" fill="#F4F6F5" stroke="#CF4A29" stroke-width="0.9" stroke-dasharray="4 3"/>
  <text x="984" y="679" class="section" fill="#CF4A29">NOT A PHYSICAL TWIN</text>
  <text x="984" y="696" class="body">no radio / no LAN / no real physics; state only changes on read or action</text>
  <text x="984" y="710" class="tiny">use a real adapter when hardware arrives</text>

  <!-- bottom trace -->
  <rect x="50" y="770" width="1500" height="260" class="paper-card"/>
  <text x="70" y="796" class="section">04 / TRACE — CONTRACT TEST, NOT A PRODUCTION CONTROLLER</text>
  <text x="70" y="819" class="heading">“打开客厅灯并关掉书房插座”</text>
  <text x="70" y="838" class="body">The deterministic planner produces a visible tool trace; every action still goes through AccessHub/policy/audit.</text>

  <rect x="70" y="858" width="170" height="42" class="soft-card"/>
  <text x="82" y="876" class="mono-small">1 / GOAL</text>
  <text x="82" y="891" class="tiny">clause split</text>
  <line x1="240" y1="879" x2="258" y2="879" stroke="#CF4A29" stroke-width="1.1" marker-end="url(#sim-arrow-signal)"/>

  <rect x="268" y="858" width="170" height="42" class="soft-card"/>
  <text x="280" y="876" class="mono-small">2 / SIM.FIND</text>
  <text x="280" y="891" class="tiny">room + kind → device</text>
  <line x1="438" y1="879" x2="456" y2="879" stroke="#CF4A29" stroke-width="1.1" marker-end="url(#sim-arrow-signal)"/>

  <rect x="466" y="858" width="170" height="42" class="soft-card"/>
  <text x="478" y="876" class="mono-small">3 / ACCESS HUB</text>
  <text x="478" y="891" class="tiny">validate · policy</text>
  <line x1="636" y1="879" x2="654" y2="879" stroke="#CF4A29" stroke-width="1.1" marker-end="url(#sim-arrow-signal)"/>

  <rect x="664" y="858" width="170" height="42" class="soft-card"/>
  <text x="676" y="876" class="mono-small">4 / SIM.ACT</text>
  <text x="676" y="891" class="tiny">adapter → state</text>
  <line x1="834" y1="879" x2="852" y2="879" stroke="#CF4A29" stroke-width="1.1" marker-end="url(#sim-arrow-signal)"/>

  <rect x="862" y="858" width="170" height="42" class="soft-card"/>
  <text x="874" y="876" class="mono-small">5 / SIM.GET</text>
  <text x="874" y="891" class="tiny">readback</text>
  <line x1="1032" y1="879" x2="1050" y2="879" stroke="#CF4A29" stroke-width="1.1" marker-end="url(#sim-arrow-signal)"/>

  <rect x="1060" y="858" width="170" height="42" class="soft-card"/>
  <text x="1072" y="876" class="mono-small">6 / SSE</text>
  <text x="1072" y="891" class="tiny">command · state · result</text>
  <line x1="1230" y1="879" x2="1248" y2="879" stroke="#0F7D78" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#sim-arrow-teal)"/>

  <rect x="1258" y="858" width="270" height="42" class="soft-card"/>
  <text x="1270" y="876" class="mono-small">7 / UI / AGENT</text>
  <text x="1270" y="891" class="tiny">trace · state · next decision</text>

  <text x="70" y="932" class="mono-small">EVENTS</text>
  <text x="140" y="932" class="body">command (southbound/down) → state (northbound/up) → intent.result (northbound/out)</text>
  <text x="70" y="954" class="mono-small">POLICY</text>
  <text x="140" y="954" class="body">same policy modes and high-risk gates as real adapters; sim must not become a bypass path.</text>
  <text x="70" y="976" class="mono-small">STATE</text>
  <text x="140" y="976" class="body">in-memory snapshots; lazy _tick updates sensor/plug/curtain/purifier values; no background radio loop.</text>
  <text x="70" y="998" class="mono-small">USE</text>
  <text x="140" y="998" class="body">demo, tests, policy/audit verification, onboarding flow, 2.5D scene; not production device control.</text>

  <text x="50" y="1062" class="kicker">SIM = CONTRACT TEST RIG · REAL ADAPTERS = SAME ACCESSHUB · DIFFERENT TRANSPORT</text>
  <text x="1550" y="1062" text-anchor="end" class="tiny">docs/ACCESS_LAYER.md · southbound/simulator.py · southbound/sim_agent.py</text>
</svg>
