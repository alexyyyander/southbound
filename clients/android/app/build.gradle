plugins { id 'com.android.application' }

android {
    namespace 'io.southbound.endpoint'
    compileSdk 35
    defaultConfig {
        applicationId 'io.southbound.endpoint'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.5.2'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
