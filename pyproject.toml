[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "southbound"
version = "0.6.0"
description = "Local-first southbound access layer for IoT agents"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Alex Yu" }]
keywords = [
  "iot",
  "mcp",
  "model-context-protocol",
  "home-automation",
  "local-first",
  "matter",
  "zigbee",
  "esp32",
  "ai-agents",
  "smart-home",
  "device-management",
  "access-control",
  "agent-tooling",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Home Automation",
  "Topic :: System :: Networking",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.0"]
dev = ["build>=1.2", "ruff>=0.6"]

[project.scripts]
southbound = "southbound.cli:main"

[project.urls]
Repository = "https://github.com/alexyyyander/southbound"
Documentation = "https://github.com/alexyyyander/southbound/blob/main/docs/README.md"
Changelog = "https://github.com/alexyyyander/southbound/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["southbound*"]

[tool.setuptools.package-data]
southbound = ["web/*", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
