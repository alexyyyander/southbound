[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-agent-lab"
version = "0.3.0"
description = "Local-first LAN observatory, access layer, simulator, and agent toolchain"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.0"]

[project.scripts]
iot-lab = "iot_agent_lab.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["iot_agent_lab*"]

[tool.setuptools.package-data]
iot_agent_lab = ["web/*"]
