name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test UI observation reference guards
        working-directory: clients/android
        run: |
          mkdir -p /tmp/southbound-ui-tests
          javac -d /tmp/southbound-ui-tests app/src/main/java/io/southbound/endpoint/UiObservation.java app/src/main/java/io/southbound/endpoint/SettingsNavigation.java tests/io/southbound/endpoint/*.java
          java -cp /tmp/southbound-ui-tests io.southbound.endpoint.UiObservationTest
          java -cp /tmp/southbound-ui-tests io.southbound.endpoint.SettingsNavigationTest
      - name: Build and lint Android reference client
        working-directory: clients/android
        run: ./gradlew --no-daemon assembleDebug lintDebug

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
