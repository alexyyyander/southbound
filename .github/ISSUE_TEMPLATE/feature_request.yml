name: Feature request
description: Propose a new capability, adapter, or integration
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Southbound do? Include device/protocol details if relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This is not an authentication-bypass or self-propagation feature.
          required: true
        - label: The device/network involved is owned or authorized by me.
          required: true
